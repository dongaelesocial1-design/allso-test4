  .allso-view,

  .allso-landing-pattern,
  .allso-landing-inner,
  .allso-hero,

  .allso-row-title { flex: 1; font-size: 16.33px; font-weight: 500; line-height: 1.375; word-break: keep-all; }

  .allso-detail { display: flex; flex-direction: column; background: #fff; }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function icon(pathD, size, stroke, width, cls) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("width", size); s.setAttribute("height", size);
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none");
  s.setAttribute("stroke", stroke); s.setAttribute("stroke-width", width);
  s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  if (cls) s.setAttribute("class", cls);

  p.setAttribute("d", pathD);

}

const APP_TITLE = "올쏘 초등 사회(22개정)";  // 전체 제목(5-1·5-2·6-1·6-2 공통)
// 헤더 제목: "(22개정)"은 별도 요소로 감싸 좁은 화면(360px 미만)에서만 CSS로 숨긴다
function setHeaderTitle(t) {
  const m = t.match(/^(.*?)(\(\d+개정\))$/);
  const h = $("bookTitle");
  if (!m) { h.textContent = t; return; }
  h.replaceChildren(document.createTextNode(m[1]), el("span", "allso-title-sub", m[2]));

function setBook(id) {
  if (!BOOKDATA[id] || id === currentBook && sel.options.length) return;
  currentBook = id;
  DATA = BOOKDATA[id];

  setHeaderTitle(BOOKS.find(b => b.id === id).title);  // 헤더: 학기명 포함

function go(h) {

function route(h) {

  $("landing").classList.add(HIDDEN);

document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener("keydown", e => {

});
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
// ---- 자료 영역만 확대/축소 (두 손가락, 트랙패드 핀치) ----
(function () {
  const sc = $("dScroll"), box = $("dImg"), PAD = 16;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  function setZoom(z, cx, cy) {
    z = Math.min(4, Math.max(1, z));
    if (Math.abs(z - zoom) < 0.001) return;
    const k = z / zoom;
    const px = sc.scrollLeft + cx, py = cy;   // 세로는 문서가 스크롤되므로 cy 가 곧 자료 영역 안의 위치
    box.style.width = (z * 100) + "%";
    sc.scrollLeft = (px - PAD) * k + PAD - cx;
    window.scrollBy(0, (py - PAD) * k + PAD - py);
    zoom = z;
  }
  let d0 = 0, z0 = 1;
  sc.addEventListener("touchstart", e => { if (e.touches.length === 2) { d0 = dist(e.touches); z0 = zoom; } }, { passive: true });
  sc.addEventListener("touchmove", e => {
    if (e.touches.length !== 2 || !d0) return;
    e.preventDefault();
    const r = sc.getBoundingClientRect();
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
    setZoom(z0 * dist(e.touches) / d0, cx, cy);
  }, { passive: false });
  sc.addEventListener("touchend", e => { if (e.touches.length < 2) d0 = 0; });
  sc.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const r = sc.getBoundingClientRect();
    setZoom(zoom * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
})();
window.addEventListener("hashchange", () => route());
render();
buildLanding();
route();
